<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관리자 요약</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1F16;text-decoration:none}a:hover{color:#1F7A4D}
table{border-collapse:collapse;width:100%;min-width:560px}
th{text-align:left;font-size:12px;font-weight:600;color:#5A6355;padding:10px 12px;border-bottom:1px solid #E3E7DE}
td{font-size:14px;padding:12px;border-bottom:1px solid #E3E7DE}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 800px; background: #FFFFFF; color: #1A1F16; font-family: 'IBM Plex Sans KR', sans-serif">
<aside style="flex: 1 1 200px; box-sizing: border-box; padding: 24px 16px; background: #F3F5F0; display: flex; flex-direction: column; gap: 4px">
<div style="padding: 0 12px 16px; font-size: 16px; font-weight: 700; color: #1F7A4D">자취한끼 관리자</div>
<a href="Admin.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 700; background: #FFFFFF; color: #1F7A4D">요약</a>
<a href="AdminRecipes.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; font-size: 14px; color: #3F463B">레시피</a>
<a href="AdminIngredients.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; font-size: 14px; color: #3F463B">재료 가격표</a>
<a href="AdminSubstitutes.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; font-size: 14px; color: #3F463B">대체 재료</a>
<a href="AdminPending.dc.html" style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border-radius: 10px; font-size: 14px; color: #3F463B">기타 재료 후보<span style="padding: 2px 8px; border-radius: 10px; background: #FFE27A; font-size: 12px; font-weight: 700; color: #1A1F16">7</span></a>
</aside>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">요약</h1>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
<div style="padding: 18px; border-radius: 14px; border: 1px solid #E3E7DE; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #5A6355">레시피</span><span style="font-size: 28px; font-weight: 700">52</span><span style="font-size: 12px; color: #5A6355">공개 50 · 숨김 2</span></div>
<div style="padding: 18px; border-radius: 14px; border: 1px solid #E3E7DE; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #5A6355">등록 재료</span><span style="font-size: 28px; font-weight: 700">148</span><span style="font-size: 12px; color: #5A6355">기본 양념 14</span></div>
<div style="padding: 18px; border-radius: 14px; border: 1px solid #E3E7DE; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #5A6355">대체 재료 쌍</span><span style="font-size: 28px; font-weight: 700">36</span><span style="font-size: 12px; color: #5A6355">더 싸게 11</span></div>
<div style="padding: 18px; border-radius: 14px; background: #FFE27A; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px">처리할 기타 재료</span><span style="font-size: 28px; font-weight: 700">7</span><span style="font-size: 12px">가격표 등록 대기</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 0 4px; font-size: 17px; font-weight: 700">할 일</h2>
<a href="AdminIngredients.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 48px; padding: 0 16px; border-radius: 12px; background: #F3F5F0; font-size: 14px"><span>가격을 갱신한 지 30일 넘은 재료 <b>12개</b></span><span style="font-weight: 600; color: #1F7A4D">가격표 열기</span></a>
<a href="AdminPending.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 48px; padding: 0 16px; border-radius: 12px; background: #F3F5F0; font-size: 14px"><span>작성자가 직접 입력한 기타 재료 <b>7개</b></span><span style="font-weight: 600; color: #1F7A4D">후보 보기</span></a>
<a href="AdminRecipes.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 48px; padding: 0 16px; border-radius: 12px; background: #F3F5F0; font-size: 14px"><span>단가에서 일부 재료가 빠진 레시피 <b>5개</b></span><span style="font-weight: 600; color: #1F7A4D">레시피 보기</span></a>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">최근 등록 레시피</h2>
<div style="overflow-x: auto">
<table>
<thead><tr><th>제목</th><th>작성자</th><th>1인분 단가</th><th>등록일</th></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<tr><td style="font-weight: 600">{{r.title}}</td><td>{{r.by}}</td><td>{{r.price}}</td><td style="color: #5A6355">{{r.date}}</td></tr>
</sc-for>
</tbody>
</table>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { rows: [
{ title: '양파 듬뿍 제육볶음', by: '졸린두부0192', price: '약 3,400원', date: '2026.10.06' },
{ title: '에어프라이어 통감자', by: '배고픈감자4821', price: '약 1,200원', date: '2026.10.05' },
{ title: '대파 계란볶음밥', by: '자취한끼 공식', price: '약 2,150원', date: '2026.10.04' },
{ title: '참치 김치찌개', by: '자취한끼 공식', price: '약 2,900원', date: '2026.10.04' }
] };
}
}
</script>
</body>
</html>
