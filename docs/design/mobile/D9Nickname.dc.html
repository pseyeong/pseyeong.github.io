<body>

<div style="width: 390px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F5F4; color: #1C1917; font-family: 'GMarketSans', 'Gmarket Sans', 'IBM Plex Sans KR', sans-serif; font-size: 16px; font-weight: 300">
<div style="display: flex; align-items: center; padding: 8px; background: #FFFFFF">
<a href="D7My.dc.html" aria-label="뒤로" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="margin: 0; font-size: 18px; font-weight: 500">설정</h1>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 8px">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 20px; background: #FFFFFF">
<div style="display: flex; justify-content: space-between; align-items: center">
<label for="nick" style="font-size: 18px; font-weight: 500">닉네임</label>
<button type="button" onClick="{{reroll}}" style="padding: 4px 12px; border-radius: 16px; border: 0; background: #F5F5F4; font-size: 14px; line-height: 24px">랜덤 뽑기</button>
</div>
<input id="nick" type="text" value="{{nick}}" onChange="{{onNick}}" maxlength="12" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 2px solid {{color}}; background: #FFFFFF; font-size: 16px">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 500; color: {{msgColor}}">{{msg}}</span><span style="color: #57534E">{{count}}/12</span></div>
<ul style="margin: 0; padding: 14px 16px 14px 34px; border-radius: 16px; background: #F5F5F4; font-size: 14px; line-height: 1.8; color: #44403C">
<li>2~12자, 한글·영문·숫자만 쓸 수 있어요</li>
<li>공백과 특수문자는 쓸 수 없어요</li>
<li>다른 사람이 쓰고 있는 닉네임은 쓸 수 없어요</li>
<li>변경 후 30일 동안은 다시 바꿀 수 없어요</li>
</ul>
<button type="button" style="padding: 12px; border: 0; border-radius: 12px; background: #16A34A; font-size: 16px; font-weight: 500; line-height: 24px">닉네임 저장</button>

</div>
<div style="flex: 1; display: flex; flex-direction: column; padding: 4px 20px; background: #FFFFFF">
<a href="D8Login.dc.html" style="display: flex; align-items: center; height: 56px; border-bottom: 1px solid #F5F5F4; font-size: 16px">로그아웃</a>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
state = { nick: '든든한계란말이' };
renderVals() {
const nick = this.state.nick;
const taken = ['배고픈감자4821', '졸린두부0192'];
let msg = '사용할 수 있는 닉네임이에요', ok = true;
if (nick.length < 2) { msg = '2자 이상 입력해 주세요'; ok = false; }
else if (!/^[가-힣a-zA-Z0-9]+$/.test(nick)) { msg = '한글·영문·숫자만 쓸 수 있어요'; ok = false; }
else if (taken.some((t) => t.toLowerCase() === nick.toLowerCase())) { msg = '이미 쓰고 있는 닉네임이에요'; ok = false; }
const adj = ['배고픈', '졸린', '든든한', '느긋한', '알뜰한'];
const food = ['감자', '두부', '계란', '대파', '김치'];
const pick = (a) => a[Math.floor(Math.random() * a.length)];
return {
nick, msg, count: nick.length, color: ok ? '#16A34A' : '#DC2626', msgColor: ok ? '#1C1917' : '#DC2626',
onNick: (e) => this.setState({ nick: e.target.value }),
reroll: () => this.setState({ nick: pick(adj) + pick(food) + String(Math.floor(1000 + Math.random() * 9000)) })
};
}
}
</script>
</body>
</html>
