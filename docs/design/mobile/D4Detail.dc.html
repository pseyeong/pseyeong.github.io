<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>레시피 상세 (디자인)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'GMarketSans';font-weight:300;font-display:swap;src:url('/_blob/98f92f89064b07f1f2e8b811c67330cc') format('woff')}
@font-face{font-family:'GMarketSans';font-weight:500;font-display:swap;src:url('/_blob/666de4c9d161cad06f93b05690400823') format('woff')}
@font-face{font-family:'GMarketSans';font-weight:700;font-display:swap;src:url('/_blob/2fbc9019a45b936cb878f55921ee339d') format('woff')}
body{margin:0}
b{font-weight:500}
a{color:#1C1917;text-decoration:none}a:hover{color:#DC2626}
button{font-family:inherit;color:inherit;font-weight:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1900px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F5F4; color: #1C1917; font-family: 'GMarketSans', 'Gmarket Sans', 'IBM Plex Sans KR', sans-serif; font-size: 16px; font-weight: 300">
<div style="height: 300px; flex: none; box-sizing: border-box; padding: 12px; background: #E7E5E4; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between">
<a href="D2Search.dc.html" aria-label="뒤로" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<button type="button" aria-label="공유" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 22px; background: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M5 13v7h14v-7"/></svg></button>
</div>
<div style="align-self: center; font-size: 14px; color: #57534E; padding-bottom: 100px">대표 사진</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 16px; margin-top: -20px; padding: 24px 20px 20px; border-radius: 20px 20px 0 0; background: #FFFFFF">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 36px; line-height: 1.2; font-weight: 500">대파<br>계란볶음밥</h1>
<div style="font-size: 15px; color: #57534E">배고픈감자4821 · 15분 · 1인분 · 프라이팬</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 16px; background: #F0FDF4">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="padding: 2px 8px; border-radius: 6px; background: #16A34A; font-size: 14px; font-weight: 500">1인분</span>
<span style="font-size: 36px; font-weight: 500; line-height: 1.1">약 2,150<span style="font-size: 18px">원</span></span>
</div>
<div style="display: flex; justify-content: space-between; font-size: 15px; padding-top: 12px; border-top: 1px solid rgba(28,25,23,0.12)">
<span>처음 장볼 때 (남는 재료 포함)</span><span style="font-weight: 500">약 9,800원</span>
</div>
<div style="font-size: 14px; line-height: 1.5; color: #57534E">추정치예요 · 가격 기준일 2026.10.01 · 일부 재료 제외</div>
</div>
</div>
<div style="display: flex; flex-direction: column; padding: 20px; background: #FFFFFF">
<h2 style="margin: 0 0 4px; font-size: 18px; font-weight: 500">재료</h2>
<sc-for list="{{ings}}" as="i" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 8px; min-height: 60px; border-bottom: 1px solid #F5F5F4">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">{{i.name}}</span><span style="font-size: 14px; color: #57534E">{{i.amount}}</span></div>
<sc-if value="{{i.sub}}" hint-placeholder-val="{{true}}">
<a href="D5Substitute.dc.html" style="display: flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 16px; background: #F0FDF4; font-size: 14px; font-weight: 500; line-height: 24px; color: #166534"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>대체</a>
</sc-if>
<span style="width: 60px; text-align: right; font-size: 16px; font-weight: 500">{{i.cost}}</span>
</div>
</sc-for>
<div style="display: flex; align-items: center; gap: 8px; min-height: 60px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">김가루</span><span style="font-size: 14px; color: #57534E">약간 · 기타 재료</span></div>
<span style="font-size: 14px; color: #57534E">단가 제외</span>
</div>
<div style="display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; padding: 12px 14px; border-radius: 12px; background: #F5F5F4; font-size: 15px">
<span style="font-weight: 500">기본 양념</span><span style="color: #57534E">식용유, 소금, 후추</span>
</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px; background: #FFFFFF">
<h2 style="margin: 0; font-size: 18px; font-weight: 500">조리 순서</h2>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<div style="display: flex; gap: 12px"><span style="width: 28px; height: 28px; flex: none; border-radius: 14px; background: #16A34A; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center">{{s.n}}</span><div style="display: flex; flex-direction: column; gap: 10px; flex: 1"><div style="font-size: 16px; line-height: 1.6">{{s.text}}</div><sc-if value="{{s.photo}}" hint-placeholder-val="{{false}}"><div style="height: 150px; border-radius: 16px; background: #E7E5E4; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #57534E">단계 사진</div></sc-if></div></div>
</sc-for>
</div>
</div>
<div style="display: flex; gap: 10px; padding: 12px 20px 20px; border-top: 1px solid #E7E5E4; background: #FFFFFF">
<button type="button" aria-label="공유" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex: none; border: 1px solid #E7E5E4; border-radius: 12px; background: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M5 13v7h14v-7"/></svg></button>
<button type="button" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: 0; border-radius: 12px; background: #16A34A; font-size: 16px; font-weight: 500; line-height: 24px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>레시피 저장</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
renderVals() {
return {
ings: [
{ name: '밥', amount: '1공기 (210g)', cost: '600원', sub: false },
{ name: '계란', amount: '2개', cost: '560원', sub: false },
{ name: '대파', amount: '1/2대 (40g)', cost: '300원', sub: true },

{ name: '굴소스', amount: '1큰술 (15g)', cost: '140원', sub: true }
],
steps: [
{ n: 1, text: '대파는 송송 썰고 햄은 작게 깍둑썰기 해요.', photo: false },
{ n: 2, text: '팬에 식용유를 두르고 약불에서 대파를 볶아 파기름을 내요.', photo: true },
{ n: 3, text: '햄을 넣어 볶다가 한쪽으로 밀고 계란을 풀어 스크램블해요.', photo: false },
{ n: 4, text: '밥과 굴소스를 넣고 센불에서 빠르게 볶은 뒤 소금, 후추로 간해요. 김가루를 올려 마무리해요.', photo: false }
]
};
}
}
</script>
</body>
</html>
