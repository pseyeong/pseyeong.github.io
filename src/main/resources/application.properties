spring.application.name=hankki
server.port=8080

# 프로젝트 최상위의 .env 를 환경 변수처럼 읽는다 (없으면 무시)
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# --- DB (Supabase Postgres). 값은 .env 에 둔다 ---
# 테이블은 db/migrations/*.sql 을 Supabase SQL Editor 에서 실행해 만든다. 앱이 스키마를 바꾸지 않는다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# DB 가 아직 없어도 서버가 뜨도록 (DB 를 쓰는 화면에서만 오류)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# 사진 업로드 크기 제한 (6단계)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
