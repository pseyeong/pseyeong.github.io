spring.application.name=hankki
server.port=8080

# 프로젝트 최상위의 .env 를 환경 변수처럼 읽는다 (없으면 무시)
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# --- DB (Supabase Postgres). 값은 .env 에 둔다 ---
# 테이블은 db/migrations/*.sql 을 Supabase SQL Editor 에서 실행해 만든다. 앱이 스키마를 바꾸지 않는다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# DB 가 아직 없어도 서버가 뜨도록 (DB 를 쓰는 화면에서만 오류)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# --- 소셜 로그인 (5단계). 키는 .env 에 둔다 ---
# 키가 없어도 서버는 뜬다 (그 서비스로 로그인을 시도할 때만 실패)
# 구글은 openid 범위만 받는다: 이름·프로필 사진·이메일을 가져오지 않는다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid

# 카카오는 동의 항목 없이 계정 고유 번호(id)만 받는다.
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# 사진 업로드 크기 제한 (6단계)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
