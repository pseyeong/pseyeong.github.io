spring.application.name=place
spring.thymeleaf.cache=false
server.port=8080

# 프로젝트 루트의 .env (KEY=VALUE) 를 읽는다. 파일이 없어도 무시.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# 카카오 지도 JavaScript 키 (templates/index.html 의 지도 영역에서 사용)
# .env 또는 환경변수 KAKAO_MAP_KEY 로 주입
kakao.map.key=${KAKAO_MAP_KEY:}

csv.dir=${CSV_DIR}

import.enabled=${IMPORT_ENABLED:false}
import.limit=${IMPORT_LIMIT:0}

permit.api.url=${PERMIT_API_URL}
permit.api.key=${PERMIT_API_KEY}

sync.enabled=${SYNC_ENABLED:false}
sync.initial-since=${SYNC_INITIAL_SINCE:20260101000000}
sync.cron=${SYNC_CRON:-}

