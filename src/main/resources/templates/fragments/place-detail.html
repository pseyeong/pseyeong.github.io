<!-- is-loading: 첫 자리를 불러오기 전까지 data-skel 요소를 회색 막대로 보여 준다 (글자는 크기용 자리표시) -->
<div th:fragment="placeDetail(compact)" xmlns:th="http://www.thymeleaf.org" data-detail-root class="is-loading flex flex-col gap-4">

  <div class="flex flex-col gap-1-5">
    <div class="flex justify-between items-center">
      <p class="text-xs text-zinc-500 h-[22px]">자주 들어온 업종 · <span data-detail-top data-skel>한식 3곳, 카페 2곳</span></p>      
      <div class="flex flex-wrap items-center gap-1-5">
        <span data-detail-badge class="hidden rounded-md bg-zinc-900 px-2 py-0-5 text-2xs font-bold text-white">회전문 자리</span>
        <span data-detail-sample class="rounded-md bg-zinc-100 px-2 py-0-5 text-2xs text-zinc-500"></span>
      </div>
    </div>
    <div class="flex items-end gap-3">
      <span data-detail-count data-skel class="text-5xl font-bold leading-none text-primary-600 lg:text-6xl">10</span>
      <span class="pb-1 text-xs leading-relaxed text-zinc-600 lg:text-sm">
        곳 이상 거쳐 간 자리<br><span data-detail-nth data-skel>지금 가게가 최소 10번째예요</span>
      </span>
    </div>
    <span data-detail-title data-skel class="self-start text-base font-semibold text-zinc-900">마포구 와우산로 00, 1층</span>
    
  </div>
  <div data-detail-units class="hidden flex flex-wrap gap-1-5"></div>
  

  <div class="grid grid-cols-3 gap-1-5 lg:gap-2">
    <div class="stat-card">
      <span class="text-2xs text-zinc-500">
        <th:block th:unless="${compact}">평균 영업 기간</th:block>
      </span>
      <span data-stat-avg data-skel class="self-start text-xs font-bold lg:text-sm">1년 1개월</span>
    </div>
    <div class="stat-card">
      <span class="text-2xs text-zinc-500">가장 오래</span>
      <span data-stat-max data-skel class="self-start text-xs font-bold lg:text-sm">3년 5개월</span>
    </div>
    <div class="stat-card">
      <span class="text-2xs text-zinc-500">지금 상태</span>
      <span data-stat-state data-skel class="self-start text-xs font-bold lg:text-sm">영업 중</span>
    </div>
  </div>

  <div class="flex flex-col gap-1-5">
    <span class="text-2xs font-semibold text-zinc-500">연도별 타임라인</span>
    <div data-detail-timeline data-skel class="relative h-7 overflow-hidden rounded-lg bg-zinc-100 lg:h-8"></div>
    <div class="flex justify-between text-2xs text-zinc-500">
      <span data-timeline-start data-skel>2016</span>
      <span data-timeline-end data-skel>2026</span>
    </div>
  </div>

  <div class="flex flex-col gap-2">
    <span class="text-2xs font-semibold text-zinc-500">가게 변천사 · 인허가 기준 · 최근 순</span>
    <!-- 자리표시 줄은 renderList 가 진짜 목록으로 바꾼다 -->
    <div data-detail-list class="flex flex-col gap-2">
      <div data-skel class="h-12 rounded-xl"></div>
      <div data-skel class="h-12 rounded-xl"></div>
      <div data-skel class="h-12 rounded-xl"></div>
    </div>
  </div>

  <!-- 사용자 제보: 저장 후 검토(승인)된 것만 변천사에 [제보]로 나간다 -->
  <div class="flex flex-col gap-2 ">
    <button type="button" data-report-toggle class="self-start text-xs font-semibold text-primary-600 underline underline-offset-2">실제와 다른가요? 알려 주세요</button>
    <form data-report-form class="hidden flex-col gap-2 rounded-lg border border-zinc-200 p-3">
      <input name="actualName" required maxlength="100" placeholder="실제 상호 (필수)"
        class="h-10 rounded-lg border border-zinc-300 bg-zinc-50 px-3 text-sm outline-none focus:border-primary-600">
      <div class="flex gap-2">
        <label class="flex min-w-0 flex-1 flex-col gap-1 text-2xs text-zinc-500">언제부터 (대략)
          <input type="month" name="periodFrom" class="h-10 rounded-lg border border-zinc-300 bg-zinc-50 px-2 text-sm outline-none focus:border-primary-600">
        </label>
        <label class="flex min-w-0 flex-1 flex-col gap-1 text-2xs text-zinc-500">언제까지 (비우면 지금까지)
          <input type="month" name="periodTo" class="h-10 rounded-lg border border-zinc-300 bg-zinc-50 px-2 text-sm outline-none focus:border-primary-600">
        </label>
      </div>
      <textarea name="memo" maxlength="500" rows="2" placeholder="메모 (선택) 예: 간판은 그대로인데 주인만 바뀌었어요"
        class="rounded-lg border border-zinc-300 bg-zinc-50 px-3 py-2 text-sm outline-none focus:border-primary-600"></textarea>
      <!-- 허니팟: 사람에겐 안 보이는 칸. 봇이 채우면 저장하지 않는다 -->
      <div aria-hidden="true" class="absolute -left-[9999px] h-px w-px overflow-hidden">
        <input name="website" tabindex="-1" autocomplete="off">
      </div>
      <div class="flex items-center gap-2">
        <button type="submit" class="rounded-lg bg-zinc-900 px-3 py-1-5 text-xs font-semibold text-white">보내기</button>
        <span data-report-message class="text-2xs text-zinc-500">검토 후 반영돼요.</span>
      </div>
    </form>
  </div>
</div>
