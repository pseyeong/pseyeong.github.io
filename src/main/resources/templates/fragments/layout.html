<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, pageCss, pageScripts)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} ?: 'backend'">backend</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/css/output.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/style.css">
  <th:block th:replace="${pageCss}"></th:block>
</head>
<body class="font-['Pretendard_Variable',Pretendard,sans-serif] antialiased">
  <th:block th:replace="${content}"></th:block>
  <th:block th:replace="${pageScripts}"></th:block>
</body>
</html>
