<!DOCTYPE html>
<html lang="ko">
<head>
    <th:block th:replace="~{fragments/head :: head}" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
</head>
<body class="min-h-dvh bg-white font-['Pretendard_Variable',Pretendard,sans-serif] antialiased">
    <main class="mx-auto flex min-h-dvh w-full max-w-[640px] flex-col px-6 py-20 md:px-24">
        <div class="flex w-full flex-col gap-12">
            <div class="flex w-full flex-col gap-12">
                <div class="flex w-full flex-col gap-16">
                    <h1 class="text-xl font-bold leading-7 text-[#030712]">회원가입</h1>

                    <form class="flex w-full flex-col gap-12" action="/signup" method="post">
                        <div class="flex w-full flex-col gap-6">
                            <p class="text-base font-medium leading-6 text-[#364153]">본인인증</p>

                            <div class="flex w-full flex-col gap-6">
                                <div class="flex w-full flex-col gap-2">
                                    <label for="phone" class="flex items-start gap-1 text-sm font-medium leading-5 text-[#364153]">
                                        휴대폰 번호
                                        <span class="font-normal text-[#f54a00]" aria-hidden="true">*</span>
                                    </label>
                                    <div class="flex w-full items-start gap-2">
                                        <input
                                            id="phone"
                                            name="phone"
                                            type="tel"
                                            autocomplete="tel"
                                            required
                                            class="h-10 min-w-0 flex-1 rounded-md border border-[rgba(30,41,57,0.1)] bg-white px-3 text-[15px] leading-6 text-[#030712] shadow-[0_1px_1px_rgba(0,0,0,0.08)] outline-none focus:border-[#f54a00]"
                                        >
                                        <button
                                            type="button"
                                            class="shrink-0 rounded-md bg-[rgba(245,74,0,0.1)] px-2.5 py-2 text-[15px] font-medium leading-6 text-[#f54a00]"
                                        >
                                            인증번호 받기
                                        </button>
                                    </div>
                                </div>

                                <div class="flex w-full flex-col gap-2">
                                    <label for="verificationCode" class="flex items-start gap-1 text-sm font-medium leading-5 text-[#364153]">
                                        인증번호
                                        <span class="font-normal text-[#f54a00]" aria-hidden="true">*</span>
                                    </label>
                                    <div class="flex w-full items-start gap-2">
                                        <div class="relative min-w-0 flex-1">
                                            <input
                                                id="verificationCode"
                                                name="verificationCode"
                                                type="text"
                                                inputmode="numeric"
                                                autocomplete="one-time-code"
                                                required
                                                class="h-10 w-full rounded-md border border-[rgba(30,41,57,0.1)] bg-white px-3 pr-14 text-[15px] leading-6 text-[#030712] shadow-[0_1px_1px_rgba(0,0,0,0.08)] outline-none focus:border-[#f54a00]"
                                            >
                                            <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-sm font-medium leading-5 text-[#f54a00]" aria-live="polite">03:00</span>
                                        </div>
                                        <button
                                            type="button"
                                            class="shrink-0 rounded-md border border-[#f54a00] bg-white px-2.5 py-2 text-[15px] font-medium leading-6 text-[#f54a00] shadow-[0_1px_1px_rgba(0,0,0,0.08)]"
                                        >
                                            인증번호 확인
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="h-px w-full bg-[rgba(39,39,42,0.1)]" role="separator"></div>

                        <div class="flex w-full flex-col gap-6">
                            <p class="text-base font-medium leading-6 text-[#364153]">회원정보 입력</p>

                            <div class="flex w-full flex-col gap-6">
                                <div class="flex w-full flex-col gap-2">
                                    <label for="username" class="flex items-start gap-1 text-sm font-medium leading-5 text-[#364153]">
                                        아이디
                                        <span class="font-normal text-[#f54a00]" aria-hidden="true">*</span>
                                    </label>
                                    <input
                                        id="username"
                                        name="username"
                                        type="text"
                                        autocomplete="username"
                                        required
                                        class="h-10 w-full rounded-md border border-[rgba(30,41,57,0.1)] bg-white px-3 text-[15px] leading-6 text-[#030712] shadow-[0_1px_1px_rgba(0,0,0,0.08)] outline-none focus:border-[#f54a00]"
                                    >
                                </div>

                                <div class="flex w-full flex-col gap-2">
                                    <label for="password" class="flex items-start gap-1 text-sm font-medium leading-5 text-[#364153]">
                                        비밀번호
                                        <span class="font-normal text-[#f54a00]" aria-hidden="true">*</span>
                                    </label>
                                    <input
                                        id="password"
                                        name="password"
                                        type="password"
                                        autocomplete="new-password"
                                        required
                                        class="h-10 w-full rounded-md border border-[rgba(30,41,57,0.1)] bg-white px-3 text-[15px] leading-6 text-[#030712] shadow-[0_1px_1px_rgba(0,0,0,0.08)] outline-none focus:border-[#f54a00]"
                                    >
                                </div>

                                <div class="flex w-full flex-col gap-2">
                                    <label for="passwordConfirm" class="flex items-start gap-1 text-sm font-medium leading-5 text-[#364153]">
                                        비밀번호 확인
                                        <span class="font-normal text-[#f54a00]" aria-hidden="true">*</span>
                                    </label>
                                    <input
                                        id="passwordConfirm"
                                        name="passwordConfirm"
                                        type="password"
                                        autocomplete="new-password"
                                        required
                                        class="h-10 w-full rounded-md border border-[rgba(30,41,57,0.1)] bg-white px-3 text-[15px] leading-6 text-[#030712] shadow-[0_1px_1px_rgba(0,0,0,0.08)] outline-none focus:border-[#f54a00]"
                                    >
                                </div>
                            </div>
                        </div>

                        <div class="h-px w-full bg-[rgba(39,39,42,0.1)]" role="separator"></div>

                        <div class="flex w-full flex-col gap-6">
                            <div class="flex w-full flex-col gap-2">
                                <label for="name" class="flex items-start gap-1 text-sm font-medium leading-5 text-[#364153]">
                                    이름
                                    <span class="font-normal text-[#f54a00]" aria-hidden="true">*</span>
                                </label>
                                <input
                                    id="name"
                                    name="name"
                                    type="text"
                                    autocomplete="name"
                                    required
                                    class="h-10 w-full rounded-md border border-[rgba(30,41,57,0.1)] bg-white px-3 text-[15px] leading-6 text-[#030712] shadow-[0_1px_1px_rgba(0,0,0,0.08)] outline-none focus:border-[#f54a00]"
                                >
                            </div>

                            <div class="flex w-full flex-col gap-2">
                                <label for="team" class="flex items-start gap-1 text-sm font-medium leading-5 text-[#364153]">
                                    팀
                                    <span class="font-normal text-[#f54a00]" aria-hidden="true">*</span>
                                </label>
                                <input
                                    id="team"
                                    name="team"
                                    type="text"
                                    required
                                    class="h-10 w-full rounded-md border border-[rgba(30,41,57,0.1)] bg-white px-3 text-[15px] leading-6 text-[#030712] shadow-[0_1px_1px_rgba(0,0,0,0.08)] outline-none focus:border-[#f54a00]"
                                >
                            </div>
                        </div>

                        <div class="flex w-full flex-col gap-5">
                            <label class="flex items-start gap-3">
                                <span class="flex items-center p-0.5">
                                    <input
                                        id="agreeAll"
                                        name="agreeAll"
                                        type="checkbox"
                                        class="peer sr-only"
                                    >
                                    <span class="inline-flex size-4 shrink-0 items-center justify-center overflow-hidden rounded border border-[rgba(30,41,57,0.15)] bg-white peer-checked:border-[#f54a00] peer-checked:bg-[#f54a00] peer-checked:[&_img]:opacity-100 peer-focus-visible:ring-2 peer-focus-visible:ring-[#f54a00]">
                                        <img src="/images/auth/icon-check.svg" alt="" class="size-3.5 opacity-0 brightness-0 invert" width="14" height="14">
                                    </span>
                                </span>
                                <span class="text-sm font-medium leading-5 text-[#364153]">모든 약관에 동의합니다.</span>
                            </label>

                            <div class="h-px w-full bg-[rgba(39,39,42,0.1)]" role="separator"></div>

                            <div class="flex w-full flex-col gap-4">
                                <div class="flex w-full items-center justify-between gap-4">
                                    <label class="flex items-start gap-3">
                                        <span class="flex items-center p-0.5">
                                            <input
                                                id="agreeTerms"
                                                name="agreeTerms"
                                                type="checkbox"
                                                required
                                                class="peer sr-only"
                                            >
                                            <span class="inline-flex size-4 items-center justify-center overflow-hidden rounded peer-checked:bg-[#f54a00] peer-checked:[&_img]:brightness-0 peer-checked:[&_img]:invert peer-focus-visible:ring-2 peer-focus-visible:ring-[#f54a00]">
                                                <img src="/images/auth/icon-check.svg" alt="" class="size-3.5" width="14" height="14">
                                            </span>
                                        </span>
                                        <span class="text-sm font-medium leading-5 text-[#364153]">[필수] 서비스 이용약관 동의</span>
                                    </label>
                                    <a href="#" class="inline-flex shrink-0 items-center gap-1 rounded px-0.5 text-sm font-medium leading-5 text-[#6a7282]">
                                        약관 보기
                                        <span class="inline-flex size-4 items-center justify-center overflow-hidden">
                                            <img src="/images/auth/icon-chevron-right.svg" alt="" class="h-[8.5px] w-[5.2px]" width="6" height="9">
                                        </span>
                                    </a>
                                </div>

                                <div class="flex w-full items-center justify-between gap-4">
                                    <label class="flex items-start gap-3">
                                        <span class="flex items-center p-0.5">
                                            <input
                                                id="agreePrivacy"
                                                name="agreePrivacy"
                                                type="checkbox"
                                                required
                                                class="peer sr-only"
                                            >
                                            <span class="inline-flex size-4 items-center justify-center overflow-hidden rounded peer-checked:bg-[#f54a00] peer-checked:[&_img]:brightness-0 peer-checked:[&_img]:invert peer-focus-visible:ring-2 peer-focus-visible:ring-[#f54a00]">
                                                <img src="/images/auth/icon-check.svg" alt="" class="size-3.5" width="14" height="14">
                                            </span>
                                        </span>
                                        <span class="text-sm font-medium leading-5 text-[#364153]">[필수] 개인정보 수집 이용 동의</span>
                                    </label>
                                    <a href="#" class="inline-flex shrink-0 items-center gap-1 rounded px-0.5 text-sm font-medium leading-5 text-[#6a7282]">
                                        약관 보기
                                        <span class="inline-flex size-4 items-center justify-center overflow-hidden">
                                            <img src="/images/auth/icon-chevron-right.svg" alt="" class="h-[8.5px] w-[5.2px]" width="6" height="9">
                                        </span>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div class="flex w-full flex-col items-center gap-6">
                            <button
                                type="submit"
                                class="flex w-full items-center justify-center rounded-md bg-[#f54a00] px-2.5 py-2 text-[15px] font-medium leading-6 text-white shadow-[0_1px_1px_rgba(0,0,0,0.08)]"
                            >
                                회원가입 완료
                            </button>
                            <a href="/login" class="rounded px-0.5 text-sm font-medium leading-5 text-[#6a7282]">
                                로그인 페이지로 돌아가기
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
