<!DOCTYPE html>
<!--/* 로그인: docs/design/mobile/D8Login.dc.html */-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::meta})}">
<head>
	<title>로그인 - 자취한끼</title>
	<meta name="robots" content="noindex">
</head>
<body>
<main class="flex flex-1 flex-col bg-primary text-on-primary">

	<div class="p-2">
		<a th:href="@{/}" aria-label="닫기" class="btn-icon text-on-primary hover:text-on-primary">
			<svg th:replace="~{fragments/ui :: icon('M6 6l12 12M18 6L6 18', 22, 2)}"></svg>
		</a>
	</div>

	<div class="flex flex-1 flex-col justify-center gap-4 px-7">
		<div class="text-title font-medium">자취<span class="text-primary-soft">한끼</span></div>
		<h1 class="m-0 text-display font-medium leading-tight">있는 재료로<br>알뜰하게<br>한 끼</h1>
		<p class="m-0 text-body leading-[1.6]">검색과 열람은 로그인 없이도 할 수 있어요. 저장과 작성에만 로그인이 필요해요.</p>
	</div>

	<div class="flex flex-col gap-2.5 rounded-t-sheet bg-surface px-5 pb-8 pt-7 text-ink">
		<p th:if="${param.error != null}" role="alert"
			class="m-0 rounded-card bg-page px-4 py-3 text-caption leading-normal text-accent">
			로그인하지 못했어요. 잠시 후 다시 시도해 주세요.
		</p>

		<a th:href="@{/oauth2/authorization/kakao}"
			class="rounded-btn bg-ink p-3 text-center text-body font-medium leading-6 text-surface hover:text-surface">카카오로 시작하기</a>
		<a th:href="@{/oauth2/authorization/google}"
			class="rounded-btn border border-[#D6D3D1] p-[11px] text-center text-body font-medium leading-6">구글로 시작하기</a>

		<div class="mt-1.5 rounded-card bg-page px-4 py-3.5 text-sub leading-[1.6]">
			가입하면 <b>배고픈감자4821</b> 같은 닉네임이 자동으로 만들어져요. 실명과 프로필 사진은 가져오지 않아요.
		</div>
		<div class="text-center text-caption leading-[1.6] text-ink-sub">
			시작하면 <a th:href="@{/terms}" class="text-ink-sub underline">이용약관</a>과
			<a th:href="@{/privacy}" class="text-ink-sub underline">개인정보처리방침</a>에 동의하게 돼요.
		</div>
	</div>

</main>
</body>
</html>
