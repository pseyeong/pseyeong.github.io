<!DOCTYPE html>
<html lang="ko">
<head>
    <th:block th:replace="~{fragments/head :: head}" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
</head>
<body class="min-h-dvh bg-white font-['Pretendard_Variable',Pretendard,sans-serif] antialiased">
    <main class="mx-auto flex min-h-dvh w-full max-w-[640px] flex-col justify-center px-6 py-20 md:px-24">
        <div class="flex w-full flex-col gap-6">
            <div class="flex w-full items-center justify-between gap-2.5">
                <h1 class="text-xl font-bold leading-7 text-[#030712]">로그인</h1>
                <div class="flex items-center gap-2">
                    <span class="inline-flex size-5 overflow-hidden">
                        <img src="/images/auth/icon-globe.svg" alt="" class="size-full" width="20" height="20">
                    </span>
                    <button type="button" class="rounded px-1 text-base font-bold leading-6 text-[#030712]" aria-pressed="true">KR</button>
                    <span class="h-4 w-px bg-[rgba(30,41,57,0.15)]" aria-hidden="true"></span>
                    <button type="button" class="rounded px-1 text-base font-medium leading-6 text-[#6a7282]" aria-pressed="false">EN</button>
                </div>
            </div>

            <form class="flex w-full flex-col gap-12" action="/login" method="post">
                <div class="flex w-full flex-col gap-6">
                    <div class="flex w-full flex-col gap-2">
                        <label for="username" class="text-base font-medium leading-6 text-[#364153]">아이디</label>
                        <input
                            id="username"
                            name="username"
                            type="text"
                            autocomplete="username"
                            class="h-12 w-full rounded-md border border-[rgba(30,41,57,0.1)] bg-white px-3 text-base leading-6 text-[#030712] shadow-[0_1px_1px_rgba(0,0,0,0.08)] outline-none focus:border-[#f54a00]"
                        >
                    </div>
                    <div class="flex w-full flex-col gap-2">
                        <label for="password" class="text-base font-medium leading-6 text-[#364153]">비밀번호</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            class="h-12 w-full rounded-md border border-[rgba(30,41,57,0.1)] bg-white px-3 text-base leading-6 text-[#030712] shadow-[0_1px_1px_rgba(0,0,0,0.08)] outline-none focus:border-[#f54a00]"
                        >
                    </div>
                </div>

                <button
                    type="submit"
                    class="flex w-full items-center justify-center rounded-lg bg-[#f54a00] px-3 py-3 text-base font-medium leading-6 text-white shadow-[0_1px_1px_rgba(0,0,0,0.08)]"
                >
                    로그인
                </button>

                <div class="flex w-full items-center justify-between gap-4">
                    <a href="/signup" class="inline-flex items-center gap-1 text-sm font-medium leading-5 text-[#f54a00]">
                        회원가입하기
                        <span class="inline-flex size-4 items-center justify-center overflow-hidden">
                            <img src="/images/auth/icon-chevron.svg" alt="" class="h-[8.5px] w-[5.2px]" width="6" height="9">
                        </span>
                    </a>
                    <div class="flex items-center justify-end gap-1">
                        <a href="#" class="px-0.5 text-sm font-medium leading-5 text-[#71717b]">아이디 찾기</a>
                        <span class="mx-1 h-3.5 w-px bg-[rgba(39,39,42,0.15)]" aria-hidden="true"></span>
                        <a href="#" class="px-0.5 text-sm font-medium leading-5 text-[#71717b]">비밀번호 찾기</a>
                    </div>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
