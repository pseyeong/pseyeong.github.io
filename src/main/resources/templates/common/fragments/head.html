<!-- 모든 프로젝트 공통 head. css 는 프로젝트마다 따로 빌드한 파일 경로를 넘긴다. 예) head('제목', '/store/css/output.css') -->
<head th:fragment="head(title, css)" xmlns:th="http://www.thymeleaf.org">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title th:text="${title}">이 자리, 몇 번째 가게?</title>
  <link rel="icon" th:href="@{/common/images/favicon.ico}" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" th:href="@{${css}}">
</head>
