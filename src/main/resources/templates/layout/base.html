<!DOCTYPE html>
<!--/*
  공통 레이아웃: 기기별 폭(폰 430 / 태블릿 768 / PC 1024) 가운데 정렬 + 하단 탭
  사용법 (각 페이지 최상단):
    <html th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{})}">
  3번째 인자는 <head> 에 더 넣을 태그(meta 등). 없으면 ~{}, 있으면 ~{::meta}
  하단 탭을 숨기려면 컨트롤러에서 model.addAttribute("hideTab", true)
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, head)">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#FFFFFF">
	<title th:replace="${title}">자취한끼</title>
	<th:block th:replace="${head}"></th:block>
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
	<div class="app-shell">
		<main th:replace="${content}"></main>
		<th:block th:unless="${hideTab}">
			<nav th:replace="~{fragments/ui :: bottomTab}"></nav>
		</th:block>
	</div>
</body>
</html>
