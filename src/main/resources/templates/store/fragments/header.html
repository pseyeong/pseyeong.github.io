<!-- 모바일은 지도 위 .mo-top-bar 가 검색/칩을 맡아서 헤더를 숨긴다 -->
<header th:fragment="header" xmlns:th="http://www.thymeleaf.org" class="max-lg:hidden flex flex-wrap items-center gap-x-4 gap-y-3 px-5 py-3">
  <h1 class="shrink-0 text-lg font-bold tracking-tight text-zinc-900">이 자리, 몇 번째 가게?</h1>

  <div class="flex min-w-0 flex-1 basis-80 max-w-[280px] flex-col relative">
    <label for="pc-search" class="sr-only">주소나 가게 이름 검색</label>
    <input id="pc-search" type="search" placeholder="주소, 장소, 가게 이름으로 찾기" class="h-10 w-full rounded-xl border border-zinc-300 bg-zinc-50 px-3-5 text-sm text-zinc-900 outline-none placeholder:text-zinc-500 focus:border-primary-600">
    <div data-search-results class="absolute left-0 right-0 top-full z-50 mt-1 hidden max-h-96 overflow-y-auto rounded-xl border border-zinc-200 bg-white shadow-lg scrollBar"></div>

  </div>
  <button type="button" class="filterBtn" aria-expanded="false" aria-controls="pc-filter-chips">
    <i class="fa-solid fa-sliders"></i>
  </button>
  <div id="pc-filter-chips" class="hidden flex flex-wrap items-center gap-2" data-filter-chips>
    <button type="button" class="chip chip-active" data-chip="all">전체</button>
    <button type="button" class="chip chip-idle" data-chip="cafe">카페·디저트</button>
    <button type="button" class="chip chip-idle" data-chip="korean">한식</button>
    <button type="button" class="chip chip-idle" data-chip="snack">분식</button>
    <button type="button" class="chip chip-idle" data-chip="japanese">일식</button>
    <button type="button" class="chip chip-idle" data-chip="chinese">중식</button>
    <button type="button" class="chip chip-idle" data-chip="western">양식·세계</button>
    <button type="button" class="chip chip-idle" data-chip="chicken">치킨·호프</button>
    <button type="button" class="chip chip-idle" data-chip="bar">주점</button>
    <button type="button" class="chip chip-idle" data-chip="fastfood">패스트푸드</button>
    <button type="button" class="chip chip-idle" data-chip="other">기타</button>
  </div>
</header>
